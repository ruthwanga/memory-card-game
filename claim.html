<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Claim Your Prize</title>
  <style>
    body {
      background-image: url(img/jackdanielssinglebarrelbarrelproof2-whiskyclubsydney_1000x1000.webp);
      background-size: cover;
      backdrop-filter: blur(5px);
      background-position: center center;
      background-repeat: no-repeat;
      font-family: 'Georgia', serif;
      padding: 40px;
    }

    h2 {
      color: white;
      text-align: center;
      font-size: 30px;
      font-weight: bold;
    }

    label {
      display: block;
      margin-bottom: 15px;
      color: white;
    }

    input[type="text"],
    input[type="tel"],
    textarea {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      background-color: #2b2b2b;
      color: #f0e6d6;
      border: 1px solid #f0e6d6;
      border-radius: 5px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    input[type="submit"] {
      background-color: #f0e6d6;
      color: #1a1a1a;
      font-weight: bold;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    input[type="submit"]:hover {
      background-color: #c7b89a;
    }

    #successMessage {
      display: none;
      text-align: center;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
      color: white;
    }
  </style>
</head>
<body>
  <div id="winModal" class="modal">
    <div class="modal-content" id="modalContent">
      <h2>🎁 Claim Your Jack Daniel's Prize</h2>

      <!-- ✅ FORM BEGINS -->
      <form action="https://script.google.com/macros/s/AKfycby3CkR0nHxCsLKT6poY4KVAr4P__2IQwmoAWbG13XsySErnvcBl3pa93iRtXe8prEj5Hw/exec" 
            method="POST" 
            target="hidden_iframe" 
            onsubmit="return showSuccessMessage();" 
            id="claimForm">

        <label>
          Name:<br>
          <input type="text" name="entry.564501738" required>
        </label>

        <label>
          Phone Number:<br>
          <input type="tel" name="entry.1206030491" required>
        </label>

        <label>
          Delivery Address:<br>
          <textarea name="entry.1566538008" required></textarea>
        </label>

        <input type="hidden" name="entry.1527249674" id="prizeField">

        <input type="submit" value="Submit">

      </form>

      <!-- Hidden iframe for form submission -->
      <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

      <!-- ✅ Thank You Message -->
      <div id="successMessage">✅ Thank you! Your prize claim has been submitted.</div>
    </div>
  </div>

  <script>
    function showSuccessMessage() {
      // Show the success message after 1 second delay
      setTimeout(() => {
        document.getElementById("successMessage").style.display = "block";
        document.getElementById("claimForm").reset();
      }, 1000);
      return true;
    }

    // Retrieve the prize from local storage when the claim page loads
    document.addEventListener("DOMContentLoaded", function () {
      const prize = localStorage.getItem("wonPrize");
      if (prize) {
        // Set the prize in the hidden input field
        document.getElementById("prizeField").value = prize;
      }
    });
  </script>

</body>
</html>
