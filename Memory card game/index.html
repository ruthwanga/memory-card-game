<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Memory Game</title>
    </head>
    <body>
        <div class="om_wrap">
            <header>
            <img src="img/Jack_Daniels_Logo.svg.png" alt="" max width="20%" srcset=""></header>
            <h3>JACK'S BIRTHDATE HAS ALWAYS BEEN A MYSTERY. HOPEFULLY YOURS ISN'T.</h3>

        </div>

     <div class="container">
        <div class="row">
            <div class="col-sm-12">
                <h1>Verify Your Age.</h1>
                <h2>MUST BE 18YEARS OR OLDER!
                    <style>
                    h2 {
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 25px;
                        color: red;
                        text-align: center;
                        margin-top:5px;
                        animation: blinker 1.75s linear infinite;
                    }
                    </style>
                </h2>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-sm-12">
                <div class="age-form">
                     <form action="" onsubmit="ageTest()">
                        <p>Enter Your Date of Birth:</p>
                        <input type="date" id="dob" value="">
                        <p class="checkbox">
                            <input type="checkbox" id="checked">
                            I agree to the Terms and Conditions. <a href="terms and conditions.html">Read Terms and Conditions</a>
                        </p>
                        <input type="submit" value="Submit" class="submit">
                    </form>
                    <p class="denied"><span id="output"></span></p>
                </div>
            </div>
        </div>
    </div>
    <!-- <script src="cover.js"></script> -->
</body>

<style>
body {
    background: #ddd;
    background-color:black;
}
html div#om-{{id}} .om_wrap{
    color: whitesmoke;
    font-family: monospace;
    font-size: 20px;
    text-align: center;
    padding: 30px;
    overflow: hidden;
}
html div#om-{{id}} .om_wrap h2{
    font-size: 20px !important;
    font-weight: bold !important;
    margin-bottom: 30px !important;

}
h1 {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 25px;
    color: white;
    text-align: center;
    margin-top:5px;
}


.age-form {
    width: 600px;
    height: 130px;
    margin: 20px auto;
    padding: 20px;
    background:gray;
    border: 5px solid #333;
    border-radius: 10px; 
}

form {
    padding: 20px;
}

.submit {
    background: olive;
    border-radius: 10px;
    color: whitesmoke;

}

.denied {
    font-size: 42px;
    color: red;
    text-align: center;
    animation: blinker 1.75s linear infinite;
}

.granted {
    font-size: 42px;
    color: yellow;
    text-align: center;
    animation: blinker 1.75s linear infinite;
}

@keyframes blinker {
    50% {
      opacity: 0;
    }
  }
</style>

<script>
function ageTest() {
    event.preventDefault();
    var currDate = new Date();
    // gets the current date
    console.log('Current Date is: ' + currDate);

    var dob = document.getElementById('dob').value;
    // dob is a string

    console.log(dob);
    var currMonth = currDate.getMonth() + 1;
    // current month ** add 1; months are 0-based by UTC
    
    var currDay = currDate.getDate();
		console.log('The current day is: ', currDay);
    
    var currYear = currDate.getFullYear();
    
    var birthYear = parseInt(dob.slice(0, 4));
		console.log(`The birth year is ${birthYear}`);
    var birthMonth = parseInt(dob.slice(5, 7));
		console.log(`The birth month is ${birthMonth}`);
    var birthDay = parseInt(dob.slice(8,10));
		console.log(`The birth day is ${birthDay}`)
		console.log(dob);
    
    var yearTest = currYear - birthYear;
    var monthTest = currMonth - birthMonth;
    var dayTest = currDay - birthDay;

    console.log(monthTest);
    console.log(dayTest);


    var output = document.getElementById('output');
    var granted = "Access Granted";
    var denied = "Access Denied!";

	const accessGranted = ()=> {
        document.getElementById("output").classList.remove('denied');
        document.getElementById("output").classList.add('granted');
    }
	
    var validate = document.getElementById('checked');
    if (validate.checked) {

        if(yearTest > 18) {
            output.innerText = granted;
						accessGranted();
            location.href="store.html"
        } else if (yearTest === 18) {
            if (monthTest > 0) {
                output.innerText = granted;
								accessGranted();
                location.href="store.html"
            } else if (monthTest === 0) {
                if(dayTest >= 0) {
                    output.innerText = granted;
										accessGranted();
                    location.href="store.html"
                } else {
                    output.innerText = denied;
										output.addClass = "denied"
                }
            } else {
                output.innerText = denied;
								output.addClass = "denied"
            }
        } else {
            output.innerText = denied;
						output.addClass = "denied"
        }
    } else {
        output.innerText = "Please check box!"
    }
}
</script>
<html>
