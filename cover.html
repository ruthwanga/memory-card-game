<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Memory Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="memory-game">
    <div class="memory-card" data-framework="Jack Daniels cap">
      <img class="front-face" src="img/jack-daniels-cap.webp" alt="jack-daniels-cap" />
      <img class="back-face" src="img/jack-daniels.png" alt="Jack Daniels" />
    </div>
    <div class="memory-card" data-framework="Jack Daniels cap">
      <img class="front-face" src="img/jack-daniels-cap.webp" alt="Jack Daniels cap" />
      <img class="back-face" src="img/jack-daniels.png" alt="Jack Daniels" />
    </div>

    <div class="memory-card" data-framework="jack-daniels-tshirt">
      <img class="front-face" src="img/jack-daniels-tshirt.jpg" alt="jack daniels tshirt" />
      <img class="back-face" src="img/jack-daniels.png" alt="Jack Daniels" />
    </div>
    <div class="memory-card" data-framework="jack-daniels-tshirt">
      <img class="front-face" src="img/jack-daniels-tshirt.jpg" alt="jack-daniels-tshirt" />
      <img class="back-face" src="img/jack-daniels.png" alt="Jack Daniels" />
    </div>

    <div class="memory-card" data-framework="jack-daniels boots">
      <img class="front-face" src="img/Jack daniels boots.jpg" alt="boots" />
      <img class="back-face" src="img/jack-daniels.png" alt="jack daniels" />
    </div>
    <div class="memory-card" data-framework="jack-daniels boots">
      <img class="front-face" src="img/Jack daniels boots.jpg" alt="boots" />
      <img class="back-face" src="img/jack-daniels.png" alt="jack daniels" />
    </div>

    <div class="memory-card" data-framework="cocktail">
      <img class="front-face" src="img/cocktail.png" alt="cocktail" />
      <img class="back-face" src="img/jack-daniels.png" alt="Jack Daniels" />
    </div>
    <div class="memory-card" data-framework="cocktail">
      <img class="front-face" src="img/cocktail.png" alt="cocktail" />
      <img class="back-face" src="img/jack-daniels.png" alt="Jack Daniels" />
    </div>

    <div class="memory-card" data-framework="playing cards">
      <img class="front-face" src="img/playing cards.jpg" alt="playing cards" />
      <img class="back-face" src="img/jack-daniels.png" alt="Jack Daniels" />
    </div>
    <div class="memory-card" data-framework="playing cards">
      <img class="front-face" src="img/playing cards.jpg" alt="playing cards" />
      <img class="back-face" src="img/jack-daniels.png" alt="Jack Daniels" />
    </div>

    <div class="memory-card" data-framework="hoodie">
      <img class="front-face" src="img/jack-daniels hoodie.jpg" alt="hoodie" />
      <img class="back-face" src="img/jack-daniels.png" alt="Jack Daniels" />
    </div>
    <div class="memory-card" data-framework="hoodie">
      <img class="front-face" src="img/jack-daniels hoodie.jpg" alt="hoodie" />
      <img class="back-face" src="img/jack-daniels.png" alt="Jack Daniels" />
    </div>
  </section>
  
  <script>
    localStorage.setItem('gameAttempts', 0); // ← resets attempts on each load

    const maxAttempts = 3;
    let attempts = parseInt(localStorage.getItem('gameAttempts')) || 0;

    const cards = document.querySelectorAll('.memory-card');

    let hasFlippedCard = false;
    let lockBoard = false;
    let firstCard, secondCard;

    // Prize mapping based on matched cards
    const prizeMapping = {
      "Jack Daniels cap": "Jack Daniels cap",
      "jack-daniels-tshirt": "jack-daniels-tshirt",
      "jack-daniels boots": "jack-daniels boots",
      "cocktail": "Cocktail",
      "playing cards": "Playing Cards Set",
      "hoodie": "Jack Daniel's Hoodie"
    };

    // Function to assign prize after a match
    function onCardsMatched(cardPair) {
      const prize = prizeMapping[cardPair];
      localStorage.setItem("wonPrize", prize);  // Store the prize in local storage
      // alert(`Congratulations! You've won the ${prize}`);
    }

    function flipCard() {
      if (lockBoard) return;
      if (!hasAttemptsLeft()) {
        alert("🚫 You have used all your 3 attempts!");
        return;
      }
      if (this === firstCard) return;

      this.classList.add('flip');

      if (!hasFlippedCard) {
        hasFlippedCard = true;
        firstCard = this;
        return;
      }

      secondCard = this;
      checkForMatch();
    }

    function checkForMatch() {
      let isMatch = firstCard.dataset.framework === secondCard.dataset.framework;
      if (isMatch) {
        onCardsMatched(firstCard.dataset.framework);  // Assign prize on match
        disableCards();
      } else {
        unflipCards();
      }
    }

    function disableCards() {
      firstCard.removeEventListener('click', flipCard);
      secondCard.removeEventListener('click', flipCard);

      setTimeout(() => {
        document.getElementById("winModal").style.display = "block";
        resetBoard();
      }, 500);
    }

    function unflipCards() {
      lockBoard = true;

      setTimeout(() => {
        firstCard.classList.remove('flip');
        secondCard.classList.remove('flip');

        attempts++;
        localStorage.setItem('gameAttempts', attempts); // Save updated attempts

        if (!hasAttemptsLeft()) {
          alert("🚫 Game Over! You've reached the max of 3 failed attempts.");
          disableAllCards();
        } else {
          alert(`❌ Not a Match. You have ${maxAttempts - attempts} attempt(s) left.`);
        }

        resetBoard();
      }, 1500);
    }

    function hasAttemptsLeft() {
      return attempts < maxAttempts;
    } 

    function disableAllCards() {
      cards.forEach(card => {
        card.removeEventListener('click', flipCard);
      });
    }

    function resetBoard() {
      [hasFlippedCard, lockBoard] = [false, false];
      [firstCard, secondCard] = [null, null];
    }

    (function shuffle() {
      cards.forEach(card => {
        let randomPos = Math.floor(Math.random() * 12);
        card.style.order = randomPos;
      });
    })();

    cards.forEach(card => card.addEventListener('click', flipCard));
  </script>

<div id="winModal" class="modal">
  <div class="modal-content">
    <h2>🎉 Congratulations!</h2>
    <!-- <p>You have won: <strong><span id="prizeName"></span></strong>!<br> -->
    Click below to claim your prize 🎁</p>
    <button><a href="claim.html">Claim Prize</a></button>
  </div>
</div>

  <style>
    .modal {
      display: none; 
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
      background-color: white;
      padding: 20px;
      margin: 15% auto;
      width: 80%;
      max-width: 400px;
      text-align: center;
      border-radius: 10px;
    }
  </style>
</body>
</html>
